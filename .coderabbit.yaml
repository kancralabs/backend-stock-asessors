# CodeRabbit Configuration
# Documentation: https://docs.coderabbit.ai/guides/configure-coderabbit

language: "id" # Bahasa Indonesia untuk review
early_access: false
reviews:
  profile: "chill" # assertive, chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop

  path_filters:
    - "!**/*.md"
    - "!**/*.txt"
    - "!**/LICENSE"

  path_instructions:
    - path: "app/**.py"
      instructions: |
        - Review untuk security vulnerabilities (SQL injection, XSS, command injection)
        - Check untuk proper error handling dan logging
        - Verify async/await usage yang benar
        - Check untuk code duplication
        - Suggest performance improvements jika ada

    - path: "tests/**.py"
      instructions: |
        - Pastikan test coverage mencukupi
        - Check untuk edge cases
        - Verify mock dan fixture usage
        - Ensure test isolation

    - path: "app/models/**.py"
      instructions: |
        - Review database schema design
        - Check untuk proper indexes
        - Verify relationships dan constraints
        - Look for N+1 query patterns

    - path: "app/api/**.py"
      instructions: |
        - Review API endpoint design
        - Check untuk proper validation
        - Verify response schemas
        - Check rate limiting implementation

chat:
  auto_reply: true

tools:
  github:
    enabled: true

  pytest:
    enabled: true
    config: "pytest.ini"

  ruff:
    enabled: true

  black:
    enabled: true
